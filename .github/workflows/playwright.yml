name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Nightly run so a regression on the hosted app is caught even without a commit.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Required for peaceiris/actions-gh-pages to push the gh-pages branch.
permissions:
  contents: write

jobs:
  test:
    name: Run Playwright suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Allure CLI is a Java program - the report step needs a JRE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --project=setup --project=chromium --project=auth-chromium
        env:
          BASE_URL: https://freelance-learn-automation.vercel.app
          API_BASE_URL: https://learn-automation.onrender.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload raw Allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      # Allure keeps trend data in a `history` folder inside the generated
      # report. Copying the previously published one into the new results is
      # what makes the trend graphs span more than a single run.
      #
      # Written as plain git so a missing gh-pages branch (every first run) is a
      # normal, silent outcome rather than a red error annotation.
      - name: Restore previous Allure history
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            if git archive FETCH_HEAD history 2>/dev/null | tar -x -C allure-results; then
              echo "Restored Allure history from gh-pages."
            else
              echo "gh-pages exists but carries no history folder yet."
            fi
          else
            echo "No gh-pages branch yet - this run starts the history."
          fi

      # Generated with the project's own allure-commandline dependency, so there
      # is no third-party action and no Docker image to build.
      - name: Generate Allure report
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Allure report to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('allure-report/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
